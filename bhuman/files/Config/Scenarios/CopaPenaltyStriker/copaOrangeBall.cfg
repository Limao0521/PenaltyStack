// Official Copa ball: orange plastic, 65 mm (reglamento § 3.3.4). Color detector, see CopaOrangeBall.h.
// 0 YOLO only (Trionda tests), 1 orange only (YOLO not loaded), 2 orange first, YOLO when no orange ball.
// 1 for the tournament: the two YOLO threads took ~130 % CPU (2026-10-30); use 2 to test with the Trionda.
mode = 1;
upperStep = 2;
lowerStep = 2;
minY = 40;
maxY = 250;
// Orange sample (YCbCr, centered at 128): Cr - 128 >= minCr, Cb - 128 <= maxCb, and
// Cr - Cb >= max(minCrMinusCb, floor median + floorMargin). Lab wood (ospinao, 2026-10-27):
// Cr - Cb median 7-20, 99.9 % <= 39. Tune with tools/copa_orange_calibrate.py on real frames.
minCr = 18;
maxCb = -4;
minCrMinusCb = 50;
floorMargin = 35;
// Hue (Cr - 128) / (128 - Cb): yellow below, red above (Trionda red stripe: 2.19 on ospinao; orange ~1).
minHueRatio = 0.35;
maxHueRatio = 1.9;
// Blob: samples at the step above, fill of its box (disc 0.785), width/height, size vs. the image height.
minSamples = 5;
minFill = 0.42;
maxAspect = 1.8;
maxRadiusFraction = 0.45;
// Radius measured / radius of a 65 mm ball at that image point from the camera matrix.
sizeTolerance = 2;
// Tracker at camera rate (30 Hz): 2 frames to start, 6 frames of tolerance without a candidate.
minConfidence = 0.35;
instantConfidence = 0.8;
confirmFrames = 2;
maxMissed = 6;
