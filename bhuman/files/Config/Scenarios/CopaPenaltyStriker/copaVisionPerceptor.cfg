// Blue post pixel (YCbCr): measured on the lab post Y=45 Cb=194 Cr=96; wood and white stay below.
minBlueCb = 30;
minCbMinusCr = 45;
// Posts must cover 18% of the image height and be twice as tall as wide (ball patches, crossbar rejected).
minRunFraction = 0.18;
minAspect = 2;
// Copa goal: 150 cm between posts. From the penalty spot (1.5 m) the posts span about 53 deg.
goalWidth = 1500;
minGoalSpan = 25deg;
maxGoalSpan = 95deg;
// Ground projection measured about 2x too far in crouch; only shown, not used for aiming.
maxDistance = 6000;
// The lower robot detector boxes the Trionda: a "robot" box at most 2.5 ball diameters around the ball is dropped.
robotBallOverlap = 2.5;
logIntervalMs = 5000;
