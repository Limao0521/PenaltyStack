// Copa: a detection counts as the referee whistle only after this much tone (ms, audio clock:
// first to last analysis passing all gates; one analysis per ~32 ms audio block). Clicks and
// squeaks span ~60-100 ms; a referee blast 250 ms or more. Log: [CopaWhistle] accepted / too short ... toneMs=...
minToneMs = 150;
// Microphones that must hear it at once (2 rejects noise right at one microphone; 1 is more sensitive).
minChannels = 1;
logRejected = true;
