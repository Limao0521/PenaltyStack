// Copa striker (striker mode): never walks before the scan. Takes the mark from the ball in front
// of the feet, sweeps the head over the goal (+25, 0, -25 deg) to decide the side, aligns at
// B-Human's kick pose without touching the ball, then kicks inside the post away from the keeper
// (left with the right foot, right with the left foot, like B-Human's penalty taker).
headTilt = 5deg;
sweepPan = 25deg;
sweepStepMs = 1200;
settleMs = 500;
goalWidth = 1500;
expectedGoalDistance = 1500;
minGoalSpan = 25deg;
maxGoalSpan = 95deg;
postMargin = 0.25;
maxAim = 20deg;
defaultSide = 1;
// The ball rests on the mark: align preKickClearance behind the kick pose, start the kick
// within alignTolerance / alignAngleTolerance, kick anyway after alignTimeoutMs.
preKickClearance = 100;
alignTolerance = 30;
alignAngleTolerance = 5deg;
alignTimeoutMs = 8000;
// Gap between the ball and the nearest sole (RobotDimensions): below it the robot only steps back,
// below twice it the robot may sidestep/turn but not move forward.
minFootClearance = 40;
// Armed (rear head): the robot believes it faces the goal and that the ball it sees in front of its
// feet IS the penalty mark (anchor of the digital twin). If it does not see the ball within ballScanMs
// (head at ballScanTilt), the mark is assumed startBallFromToes in front of the toes. The goal line is
// penaltyDistance beyond the mark; posts seen within postMatchTolerance of it correct the heading
// (at most maxHeadingCorrection). Striker mode re-takes the mark from the ball (within maxMarkDistance)
// and scans again to decide the shot. Stop clears everything until the next arm.
startBallFromToes = 200;
penaltyDistance = 1300;
maxMarkDistance = 600;
ballScanMs = 2000;
ballScanTilt = 25deg;
postMatchTolerance = 12deg;
maxHeadingCorrection = 15deg;
// Lower-camera range: pitch offset calibrated at each arm from the known placement (at most +-8 deg).
maxPitchCorrection = 8deg;
// While adjusting, the robot stays in a box behind the ball: soles never past the line through the
// ball (minFootClearance before its surface), at most boxMaxBack behind and boxMaxLateral aside.
boxMaxBack = 450;
boxMaxLateral = 150;
// Real-time twin: each new ball sighting moves the mark trackGain of the way (gate trackGate mm).
trackGain = 0.3;
trackGate = 150;
