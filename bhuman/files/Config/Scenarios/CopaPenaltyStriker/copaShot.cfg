// Copa striker: find the ball (head down), walk up to it facing the goal, stop and
// sweep the head over the goal (+25, 0, -25 deg) to collect post and keeper bearings,
// then kick inside the post on the side away from the keeper (default side without keeper).
approachDistance = 300;
standOffDistance = 200;
headTilt = 5deg;
sweepPan = 25deg;
sweepStepMs = 1200;
settleMs = 500;
goalWidth = 1500;
expectedGoalDistance = 1500;
minGoalSpan = 25deg;
maxGoalSpan = 95deg;
postMargin = 0.25;
maxAim = 20deg;
defaultSide = 1;
