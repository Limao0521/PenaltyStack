// Copa striker: find the ball (head down), walk up to it facing the goal, stop and
// sweep the head over the goal (+25, 0, -25 deg) to collect post and keeper bearings,
// align at B-Human's kick pose without touching the ball (step back if too close, sidestep and
// turn 10 cm behind the kick pose), then kick inside the post away from the keeper.
approachDistance = 400;
standOffDistance = 300;
headTilt = 5deg;
sweepPan = 25deg;
sweepStepMs = 1200;
settleMs = 500;
goalWidth = 1500;
expectedGoalDistance = 1500;
minGoalSpan = 25deg;
maxGoalSpan = 95deg;
postMargin = 0.25;
maxAim = 20deg;
defaultSide = 1;
// The ball rests on the mark: align preKickClearance behind the kick pose, start the kick
// within alignTolerance / alignAngleTolerance, kick anyway after alignTimeoutMs.
preKickClearance = 100;
alignTolerance = 30;
alignAngleTolerance = 5deg;
alignTimeoutMs = 8000;
// Gap between the ball and the nearest sole (RobotDimensions): below it the robot only steps back,
// below twice it the robot may sidestep/turn but not move forward.
minFootClearance = 40;
