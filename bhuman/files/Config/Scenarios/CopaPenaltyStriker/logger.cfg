// Is logging enabled? Off in Copa: it JPEG-encoded every frame of both cameras and wrote ~1 GB every
// 6 min (CPU temperature warnings, 2026-10-30). The text log /home/nao/logs/bhumand_*.log is not affected.
enabled = false;

// The directory that will contain the log file.
path = "/home/nao/logging";

// The number of buffers allocated.
numOfBuffers = 12000;

// The size of each buffer in bytes.
sizeOfBuffer = 200000;

// The scheduling priority of the writer thread.
writePriority = -2;

// Logging will stop if less MB are available to the target device.
minFreeDriveSpace = 100;

// Representations to log per thread
representationsPerThread = [
  {
    thread = Upper;
    representations = [
      JPEGImage,

      BallPercept,
      BallSpots,
      BodyContour,
      CameraInfo,
      CameraMatrix,
      CirclePercept,
      FieldBoundary,
      FrameInfo,
      ImageCoordinateSystem,
      LinesPercept,
      ObstaclesFieldPercept,
      ObstaclesImagePercept,
      OdometryData,
      PenaltyMarkPercept,
    ];
  },
  {
    thread = Lower;
    representations = [
      JPEGImage,

      BallPercept,
      BallSpots,
      BodyContour,
      CameraInfo,
      CameraMatrix,
      CirclePercept,
      FieldBoundary,
      FrameInfo,
      ImageCoordinateSystem,
      LinesPercept,
      ObstaclesFieldPercept,
      ObstaclesImagePercept,
      OdometryData,
      PenaltyMarkPercept,
    ];
  },
  {
    thread = Cognition;
    representations = [
      ActivationGraph,
      AlternativeRobotPoseHypothesis,
      ArmMotionRequest,
      BallModel,
      FieldBall,
      FilteredBallPercepts,
      BehaviorStatus,
      CameraCalibration,
      GameState,
      IMUCalibration,
      HeadMotionRequest,
      MotionRequest,
      ObstacleModel,
      OdometryData,
      ReceivedTeamMessages,
      RobotPose,
      SelfLocalizationHypotheses,
      SideInformation,
      SkillRequest,
      StrategyStatus,
      TeammatesBallModel,
      TeamData,
    ];
  },
  {
    thread = Motion;
    representations = [
      FallDownState,
      FootOffset,
      FootSupport,
      FrameInfo,
      FsrData,
      FsrSensorData,
      GroundContactState,
      GyroState,
      InertialSensorData,
      InertialData,
      JointAnglePred,
      JointCalibration,
      JointPlay,
      JointRequest,
      JointSensorData,
      KeyStates,
      MotionInfo,
      OdometryData,
      OdometryDataPreview,
      SystemSensorData,
      RobotStableState,
      WalkLearner,
      WalkStepData,
    ];
  },
  {
    thread = Audio;
    representations = [
      AudioData,
      FrameInfo,
      Whistle,
    ];
  },
  {
    thread = Referee;
    representations = [
      RefereePercept,
      Keypoints,
    ];
  }
];
