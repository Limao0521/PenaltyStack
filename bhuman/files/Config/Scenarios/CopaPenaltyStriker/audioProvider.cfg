retries = 10;                     //**< Number of tries to open device. */
retryDelay = 500;                 //**< Delay before a retry to open device. */
allChannels = false;              //**< Use all 4 channels, instead of only two. */
sampleRate = 16000;               //**< Sample rate to capture. This variable will contain the framerate the driver finally selected. */
frames = 512;                     //**< Number of frames read in one cycle. */
// Copa: no GameController, the robot is never in set/playing; the referee whistle starts the shot after arming.
onlySoundInSetAndPlaying = false;
captureCard = "Digital";          //**< The mixer that controls the capture volume. */
captureVolume = 75.0;             //**< The desired capture volume in percent. */
