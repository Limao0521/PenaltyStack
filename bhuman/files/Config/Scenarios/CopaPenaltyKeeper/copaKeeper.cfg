// Copa keeper: track the ball with the head; when it rolls towards the keeper, walk
// sideways to where it will cross (inside the goal area), and when it is about to
// arrive use the B-Human genuflect (squatWideArmsBack, RoboCup keeper block). Never dives.
minApproachSpeed = 150;
maxTime = 4;
genuflectTime = 0.8;
genuflectDistance = 500;
standRadius = 80;
maxLateral = 700;
confirmMs = 150;
holdMs = 2500;
walkSpeed = 1;
// Own velocity fit over the last 600 ms of ball sightings (odometry frame).
velocityWindowMs = 600;
// Approved 2026-10-28 after the simulation check. 0 stand (never goes down), 1 sit (sitDownKeeper),
// 2 genuflect (genuflectStandDefender: split to the floor, gets up by itself; seen in simulation).
blockMotion = 2;
telemetryMs = 500;
