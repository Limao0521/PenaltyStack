// Copa: a detection counts as the referee whistle only after this much tone (ms). The recognizer
// opens after ~15 ms of tone, so clicks, squeaks and beeps started the shot (ospinao, 2026-10-29).
// A referee blast lasts 300 ms or more. [CopaWhistle] accepted / too short ... toneMs=... in the log.
minToneMs = 200;
// Microphones that must hear it at once (2 rejects noise right at one microphone; 1 is more sensitive).
minChannels = 1;
logRejected = true;
