// PenaltyStack: start/stop of the penalty routine (rules 2.7, 3.3.5, 3.3.6).
// role and startMode are rewritten by the deploy dialog for every robot.
role = striker;
startMode = buttonOnly;
activeDurationMs = 28000;    // the shot must be executed within 30 s of the whistle
whistleArmDelayMs = 2000;    // ignore whistles right after arming
minWhistleConfidence = 0.3;  // WhistleRecognizer correlation
tapMinMs = 40;
tapMaxMs = 800;
abortHoldMs = 500;           // head rear: manual deactivation (sensor not on the legs)
roleToggleHoldMs = 2000;     // head front hold while waiting: striker <-> keeper
unstiffHoldMs = 1000;        // three head buttons: joints off
doneGraceMs = 500;
speak = true;
